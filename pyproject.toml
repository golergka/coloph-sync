[project]
name = "coloph-sync"
version = "0.3.3"
description = "Commit checks, worktree integration, and deployment coordination for Git projects"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
coloph-sync = "coloph_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coloph_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
